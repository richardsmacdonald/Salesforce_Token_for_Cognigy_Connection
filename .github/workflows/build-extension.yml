name: Build extension package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile the extension
        run: npm run build

      - name: Create the uploadable package
        run: tar -czf salesforce-token-extension.tar.gz $(ls -d build package.json package-lock.json README.md icon.png 2>/dev/null) && tar -tzf salesforce-token-extension.tar.gz

      - name: Publish the package as a download
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: salesforce-token-extension.tar.gz
          if-no-files-found: error
